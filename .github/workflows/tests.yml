name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # The suite has only ever been run on Windows. Running it on Linux is the
    # point of this job as much as the tests themselves are.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install torch (CPU build)
        # requirements.txt just says "torch", which on Linux pulls the CUDA
        # build: gigabytes of wheels for a runner with no GPU. Install the CPU
        # build first and the next step sees the requirement as satisfied.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Show environment
        run: |
          python -VV
          python -c "import numpy, chess, torch; print('numpy', numpy.__version__); print('chess', chess.__version__); print('torch', torch.__version__, 'cuda', torch.cuda.is_available())"

      - name: Run tests
        # The CUDA-specific tests skip themselves when no device is present;
        # -ra lists what skipped so a silently-empty run is visible.
        run: pytest -ra -q
